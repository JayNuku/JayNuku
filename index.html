<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Allowance Tracker (GH₵)</title>
<style>
:root{--bg:#f5f7f4;--card:rgba(255,255,255,.78);--tx:#17231e;--mut:#718078;--bd:rgba(32,72,54,.12);--ac:#087f5b;--bad:#c0392b;--track:#e5eee8;--shadow:0 18px 48px rgba(24,67,48,.09);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#111a17;--card:rgba(30,43,37,.82);--tx:#eff7f2;--mut:#a1b3a9;--bd:rgba(220,245,229,.12);--ac:#50d6a1;--bad:#ff8277;--track:#2b3a32;--shadow:0 18px 48px rgba(0,0,0,.22);color-scheme:dark}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{min-height:100vh;margin:0;background:radial-gradient(ellipse at 8% 8%,rgba(94,213,157,.20),transparent 34%),radial-gradient(ellipse at 94% 24%,rgba(113,174,235,.16),transparent 32%),radial-gradient(ellipse at 50% 100%,rgba(238,189,105,.12),transparent 38%),var(--bg);background-attachment:fixed;color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;transition:background-color .25s,color .25s;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;width:260px;height:260px;border-radius:50%;filter:blur(60px);opacity:.19;pointer-events:none;z-index:-1;animation:float 18s ease-in-out infinite alternate}
body:before{background:#48c78e;top:18%;left:-150px}
body:after{background:#71aef0;right:-160px;bottom:8%;animation-delay:-8s}
@keyframes float{to{transform:translate(90px,35px) scale(1.15)}}
main{max-width:820px;margin:0 auto;padding:34px 18px 56px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 20px}
.brand{display:flex;align-items:center;gap:12px}
.brandicon{display:grid;place-items:center;width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,#0b8b63,#38bd87);color:white;font-size:23px;box-shadow:0 8px 20px rgba(8,127,91,.25)}
h1{font-size:clamp(21px,4vw,27px);letter-spacing:-.7px;margin:0}
.subtitle{color:var(--mut);font-size:13px;margin-top:2px}
.card{background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--bd);border-radius:20px;padding:19px;margin-bottom:14px;box-shadow:var(--shadow);animation:rise .45s ease both}
.card:nth-of-type(2){animation-delay:.04s}
.card:nth-of-type(3){animation-delay:.08s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.seg{display:flex;padding:3px;border:1px solid var(--bd);border-radius:12px;background:rgba(120,150,130,.07)}
button{font:inherit;cursor:pointer;transition:transform .16s,box-shadow .16s,background .16s}
button:hover{transform:translateY(-1px)}
button:active{transform:scale(.97)}
.seg button{border:0;background:transparent;color:var(--mut);padding:7px 14px;border-radius:9px}
.seg button.on{background:var(--ac);color:#fff;box-shadow:0 4px 12px rgba(8,127,91,.2)}
.nav{margin-left:auto;display:flex;align-items:center;gap:7px}
.nav button,.btn,.theme{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:11px;padding:8px 12px}
.theme{width:42px;height:42px;padding:0;font-size:18px}
.btn.p{background:linear-gradient(135deg,#087f5b,#17a975);color:white;border-color:transparent;font-weight:650;box-shadow:0 7px 16px rgba(8,127,91,.19);padding:10px 16px}
.btn:hover,.nav button:hover,.theme:hover{box-shadow:0 6px 15px rgba(20,60,40,.12)}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:5px;font-weight:600}
input,select{width:100%;padding:10px 11px;border:1px solid var(--bd);border-radius:11px;background:rgba(255,255,255,.42);color:var(--tx);font:inherit;outline:none;transition:border .2s,box-shadow .2s}
[data-theme=dark] input,[data-theme=dark] select{background:rgba(0,0,0,.12)}
input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 17%,transparent)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}
.stats{margin-top:16px}
.stat{padding:12px 13px;border:1px solid var(--bd);border-radius:14px;background:rgba(120,150,130,.06)}
.big{font-size:clamp(20px,4vw,25px);font-weight:750;letter-spacing:-.5px;font-variant-numeric:tabular-nums;margin-top:2px}
.mut{color:var(--mut);font-size:13px}
.bar{height:10px;background:var(--track);border-radius:99px;overflow:hidden;margin:14px 0 7px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#23a879,#70d69c);border-radius:99px;transition:width .45s ease}
.bad{color:var(--bad)}
.hint{padding:9px 12px;border-radius:11px;background:rgba(8,127,91,.07)}
h2{font-size:15px;letter-spacing:-.1px;margin:0 0 12px}
.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.donutwrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donut{width:158px;height:158px;border-radius:50%;position:relative;flex:none;box-shadow:0 8px 20px rgba(0,0,0,.08);transition:transform .3s}
.donut:hover{transform:rotate(-5deg) scale(1.03)}
.donut:after{content:"";position:absolute;inset:27px;background:var(--card);border:1px solid var(--bd);border-radius:50%}
.leg{flex:1;min-width:170px}
.leg div{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid var(--bd)}
.leg div:last-child{border:0}
.leg b{width:10px;height:10px;border-radius:4px;flex:none}
.leg span:last-child{margin-left:auto;font-variant-numeric:tabular-nums;font-size:13px}
.days{display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:10px;padding-bottom:2px;border-bottom:1px solid var(--bd)}
.days div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.days i{width:100%;max-width:30px;background:linear-gradient(180deg,#54d39c,#07835c);border-radius:6px 6px 2px 2px;min-height:2px;transition:height .4s,filter .2s}
.days div:hover i{filter:brightness(1.13)}
.days small{font-size:10px;color:var(--mut);margin-top:5px}
.item{display:flex;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--bd)}
.item:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.item .amt{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.x{border:0;background:transparent;color:var(--mut);font-size:19px;border-radius:8px;padding:2px 7px}
.x:hover{background:rgba(192,57,43,.1);color:var(--bad)}
.footer{text-align:center;color:var(--mut);font-size:12px;padding:7px 0 0}
@media(max-width:520px){main{padding:22px 13px 38px}.card{padding:16px;border-radius:17px}.top{margin-bottom:16px}.nav{gap:4px}.nav button{padding:7px 10px}.donut{width:138px;height:138px}.donut:after{inset:24px}.sectionhead .btn{font-size:12px;padding:8px 9px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main>
<header class="top">
  <div class="brand">
    <div class="brandicon">₵</div>
    <div><h1>Allowance Tracker</h1><div class="subtitle">A clearer view of your spending</div></div>
  </div>
  <button class="theme" id="theme" aria-label="Switch color theme" title="Switch color theme">☀️</button>
</header>

<div class="card">
  <div class="g">
    <div><label>Weekly allowance (GH₵)</label><input id="wk" type="number" min="0" step="0.01" inputmode="decimal"></div>
    <div><label>Monthly allowance (GH₵)</label><input id="mo" type="number" min="0" step="0.01" inputmode="decimal"></div>
  </div>
</div>

<div class="card">
  <div class="row">
    <div class="seg"><button id="vw" class="on">Week</button><button id="vm">Month</button></div>
    <div class="nav"><button id="pv" aria-label="Previous">‹</button><span id="lbl" class="mut"></span><button id="nx" aria-label="Next">›</button></div>
  </div>
  <div class="g stats">
    <div class="stat"><div class="mut">Allowance</div><div class="big" id="sb">–</div></div>
    <div class="stat"><div class="mut">Spent</div><div class="big" id="ss">–</div></div>
    <div class="stat"><div class="mut">Left</div><div class="big" id="sl">–</div></div>
  </div>
  <div class="bar"><i id="pb" style="width:0"></i></div>
  <div class="mut hint" id="hint"></div>
</div>

<div class="card">
  <h2>Add expense</h2>
  <div class="g">
    <div><label>Amount (GH₵)</label><input id="am" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00"></div>
    <div><label>Category</label><select id="ct"></select></div>
    <div><label>Date</label><input id="dt" type="date"></div>
    <div><label>Note (optional)</label><input id="nt" type="text" placeholder="e.g. waakye"></div>
  </div>
  <div style="margin-top:10px"><button class="btn p" id="add">Add expense</button></div>
</div>

<div class="card">
  <h2>Where it went</h2>
  <div class="donutwrap"><div class="donut" id="dn"></div><div class="leg" id="lg"></div></div>
</div>

<div class="card">
  <h2>Spending by day</h2>
  <div class="days" id="dy"></div>
</div>

<div class="card">
  <div class="sectionhead"><h2>Expenses</h2><button class="btn" id="csv">↓ Export CSV</button></div>
  <div id="ls"></div>
  <div class="footer">Your spending data stays in this browser</div>
</div>
</main>
<script>
const CATS={"Food":"#e8833a","Transport":"#3a8fe8","Data & Airtime":"#8e5be8","Academics":"#0f9d6b","Hostel & Rent":"#c9a227","Personal Care":"#e85b9a","Fun & Social":"#e8504a","Savings":"#4aa3a3","Other":"#8a8a82"};
let S={wk:0,mo:0,items:[]},view="week",off=0;
try{document.documentElement.dataset.theme=localStorage.getItem("allowance-theme")||"light"}catch(e){}
const $=id=>document.getElementById(id);
try{const r=localStorage.getItem("allowance-v1");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem("allowance-v1",JSON.stringify(S))}catch(e){}}
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const money=n=>"GH₵ "+Number(n).toLocaleString("en-GH",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function range(){
  const t=new Date();t.setHours(12,0,0,0);
  if(view==="week"){const m=new Date(t);m.setDate(t.getDate()-((t.getDay()+6)%7)+off*7);const e=new Date(m);e.setDate(m.getDate()+6);return[m,e]}
  const s=new Date(t.getFullYear(),t.getMonth()+off,1,12),e=new Date(t.getFullYear(),t.getMonth()+off+1,0,12);return[s,e];
}
function render(){
  const[s,e]=range(),a=ymd(s),b=ymd(e);
  const fm=d=>d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
  $("lbl").textContent=view==="week"?fm(s)+" – "+fm(e):s.toLocaleDateString("en-GB",{month:"long",year:"numeric"});
  $("vw").classList.toggle("on",view==="week");$("vm").classList.toggle("on",view==="month");
  const its=S.items.filter(i=>i.date>=a&&i.date<=b).sort((x,y)=>y.date.localeCompare(x.date)||y.id-x.id);
  const spent=its.reduce((n,i)=>n+i.amt,0),bud=view==="week"?S.wk:S.mo,left=bud-spent;
  $("sb").textContent=bud?money(bud):"Set above";$("ss").textContent=money(spent);
  $("sl").textContent=bud?money(left):"–";$("sl").className="big"+(bud&&left<0?" bad":"");
  const pct=bud?Math.min(100,spent/bud*100):0;$("pb").style.width=pct+"%";$("pb").style.background=pct>=100?"var(--bad)":"var(--ac)";
  const today=new Date();today.setHours(12,0,0,0);
  let h="";
  if(bud){const days=Math.round((e-s)/864e5)+1;
    if(today>=s&&today<=e){const rem=Math.max(1,Math.round((e-today)/864e5)+1);h=left>0?"You can spend about "+money(left/rem)+" per day for the remaining "+rem+" day"+(rem>1?"s":"")+".":"You’re over budget by "+money(-left)+".";}
    else h=left>=0?"Finished with "+money(left)+" to spare.":"Went over by "+money(-left)+".";}
  else h="Enter your "+view+"ly allowance above to see how much is left.";
  $("hint").textContent=h;

  const tot={};its.forEach(i=>tot[i.cat]=(tot[i.cat]||0)+i.amt);
  const ents=Object.entries(tot).sort((x,y)=>y[1]-x[1]);
  if(!ents.length){$("dn").style.background="var(--track)";$("lg").innerHTML='<span class="mut">No spending in this period yet.</span>'}
  else{let c=0,g=[];ents.forEach(([k,v])=>{const p=v/spent*100;g.push(CATS[k]+" "+c+"% "+(c+p)+"%");c+=p});
    $("dn").style.background="conic-gradient("+g.join(",")+")";
    $("lg").innerHTML=ents.map(([k,v])=>'<div><b style="background:'+CATS[k]+'"></b><span>'+esc(k)+'</span><span>'+money(v)+' · '+Math.round(v/spent*100)+'%</span></div>').join("")}

  const n=Math.round((e-s)/864e5)+1,arr=[];
  for(let k=0;k<n;k++){const d=new Date(s);d.setDate(s.getDate()+k);const key=ymd(d);arr.push({d,v:its.filter(i=>i.date===key).reduce((q,i)=>q+i.amt,0)})}
  const mx=Math.max(1,...arr.map(x=>x.v));
  $("dy").innerHTML=arr.map(x=>'<div title="'+esc(fm(x.d)+": "+money(x.v))+'"><i style="height:'+(x.v/mx*85)+'%"></i><small>'+(n>10?(x.d.getDate()%5===1?x.d.getDate():"&nbsp;"):x.d.toLocaleDateString("en-GB",{weekday:"narrow"}))+'</small></div>').join("");

  $("ls").innerHTML=its.length?its.map(i=>'<div class="item"><span class="dot" style="background:'+CATS[i.cat]+'"></span><div><div>'+esc(i.note||i.cat)+'</div><div class="mut">'+esc(i.cat)+' · '+esc(new Date(i.date+"T12:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"}))+'</div></div><span class="amt">'+money(i.amt)+'</span><button class="x" data-id="'+i.id+'" aria-label="Delete">×</button></div>').join(""):'<span class="mut">Nothing logged for this period.</span>';
}
$("theme").textContent=document.documentElement.dataset.theme==="dark"?"🌙":"☀️";
$("theme").onclick=()=>{const next=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=next;$("theme").textContent=next==="dark"?"🌙":"☀️";try{localStorage.setItem("allowance-theme",next)}catch(e){}};
$("ct").innerHTML=Object.keys(CATS).map(k=>"<option>"+esc(k)+"</option>").join("");
$("dt").value=ymd(new Date());
$("wk").value=S.wk||"";$("mo").value=S.mo||"";
$("wk").oninput=()=>{S.wk=parseFloat($("wk").value)||0;save();render()};
$("mo").oninput=()=>{S.mo=parseFloat($("mo").value)||0;save();render()};
$("vw").onclick=()=>{view="week";off=0;render()};
$("vm").onclick=()=>{view="month";off=0;render()};
$("pv").onclick=()=>{off--;render()};
$("nx").onclick=()=>{off++;render()};
$("add").onclick=()=>{
  const amt=parseFloat($("am").value);
  if(!(amt>0)){$("am").focus();return}
  S.items.push({id:Date.now(),amt,cat:$("ct").value,date:$("dt").value||ymd(new Date()),note:$("nt").value.trim()});
  $("am").value="";$("nt").value="";save();render();
};
$("ls").onclick=e=>{
  const id=e.target.dataset&&e.target.dataset.id;
  if(id){S.items=S.items.filter(i=>String(i.id)!==id);save();render()}
};
$("csv").onclick=()=>{
  const rows=[
    ["Date","Amount (GH₵)","Category","Note"],
    ...S.items.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id)
      .map(i=>[i.date,Number(i.amt).toFixed(2),i.cat,i.note||""])
  ];
  const csv=rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n");
  const blob=new Blob(["\uFEFF",csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;
  a.download="allowance-expenses-"+ymd(new Date())+".csv";
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
};
render();
</script>
</body>
</html>
